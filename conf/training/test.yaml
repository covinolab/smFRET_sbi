
defaults:
  - embedding: lru
  - _self_

training:
  batch_size: 132
  validation_fraction: 0.1
  num_epochs: 20
  seed: 42
  compile: false
  grad_clip: 10.0
  checkpoint_interval_minutes: 5
  resume_from: null

optimizer:
  lr: 5e-4
  weight_decay: 0.01

embedding:
    dim: 8
    dim_mults: [1, 2]
    attention: true
    padding_mode: reflect
    kernel_size: 16
    downsample: 8
    output_dim: 64

flow:
  model: "maf"
  hidden_features: 64
  num_transforms: 4
  num_blocks: 2
  dropout_probability: 0.1
  use_batch_norm: true

classifier:
  hidden_features: 64
  num_atoms: 32
  dropout_probability: 0.05
  num_blocks : 6
  use_batch_norm: true
  regularization_strength: 0.0

# Data settings
data:
  data_dir: "data/test"
  chunk_size: 128
  chunk_step: 12
  num_workers: 2
  prefetch_factor: 4

artifacts:
  model_filename: "estimator.pkl"
  checkpoint_filename: "checkpoint.pt"
  data_config_copy_filename: "data_config.yaml"
 
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false  # Stay in original directory
