
defaults:
  - _self_

training:
  batch_size: 128
  validation_fraction: 0.1
  num_epochs: 50
  compile: true
  grad_clip: 0.0
  checkpoint_interval_minutes: 0.1
  resume_from: null

optimizer:
  lr: 1e-3
  weight_decay: 0.01

scheduler:
  max_lr: 5e-3
  pct_start: 0.3
  final_div_factor: 1e4

embedding:
  dim: 16
  dim_mults: [1]
  attention: False
  kernel_size: 8
  output_dim: 16

flow:
  model: "maf"
  hidden_features: 32
  num_transforms: 1
  num_blocks: 2
  dropout_probability: 0.1
  use_batch_norm: false

# Data settings
data:
  data_dir: "data/test"
  chunk_size: 512
  chunk_step: 1
  num_workers: 6
  prefetch_factor: 3

artifacts:
  model_filename: "npe_density_estimator.pkl"
  checkpoint_filename: "checkpoint.pt"
  data_config_copy_filename: "data_config.yaml"
 
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false  # Stay in original directory

