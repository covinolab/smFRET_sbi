defaults:
  - embedding: cnn
  - _self_

training:
  batch_size: 128
  validation_fraction: 0.1
  num_epochs: 50
  seed: 42
  compile: false
  grad_clip: 10.0
  checkpoint_interval_minutes: 30
  resume_from: null

optimizer:
  lr: 5e-4
  weight_decay: 0.01

classifier:
  hidden_features: 128
  num_atoms: 100
  dropout_probability: 0.2
  num_blocks : 2
  use_batch_norm: false

data:
  data_dir: "data/test"
  chunk_size: 128
  chunk_step: 12
  num_workers: 6
  prefetch_factor: 3

artifacts:
  model_filename: "ratio_estimator.pkl"
  checkpoint_filename: "checkpoint.pt"
  data_config_copy_filename: "data_config.yaml"

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
