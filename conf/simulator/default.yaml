# Prior bounds for all inferred parameters (10 groups; total dim = num_knots + 9)
prior:
  # Dynamics parameters
  logD_lims: [-0.5, 2.0]       # log10 of diffusion coefficient
  
  # FRET parameters  
  R0_lims: [6.0, 12.0]          # Förster radius
  kD_lims: [0.1, 10.0]         # Donor excitation rate
  
  # Background rates
  k_gb_lims: [0.0, 0.25]        # Green photon background rate
  k_rb_lims: [0.0, 0.25]        # Red photon background rate
  
  # Detector efficiencies
  eta_g_lims: [0.7, 1.0]       # Green detector quantum efficiency
  eta_r_lims: [0.7, 1.0]       # Red detector quantum efficiency
  
  # Spectral leak fractions (diagonals derived: C_gg = 1 - C_gr, C_rr = 1 - C_rg)
  C_gr_lims: [0.0, 0.2]        # Prob green photon -> red detector
  C_rg_lims: [0.0, 0.2]        # Prob red photon -> green detector

  num_knots: 5                # number of spline knots for potential
  spline_mean: null           # mean values for spline coefficients (default: zero)
  spline_scale: 10.0
  spline_correlation: 1
  prior_type: uniform         # "uniform" (independent per-knot), "igmrf" (first/second-difference prior), or "gp" (exponential-decay GP)
  igmrf_order: 1              # 1=first differences, 2=curvature penalty (only used when prior_type=igmrf)


# Fixed simulator parameters (not inferred)
simulator:
  mode: "equilibrium"            # "equilibrium" (standard smFRET_simulator) or "binding" (two-way shooting from x_TS)
  total_time: 10000.0
  saving_frequency: 10000
  time_step: 5e-5
  spline_type: "cubic"
  boundary_condition: [linear, linear]
  num_boundary_knots: 3
  max_force: 30.0
  x_min: 4.0
  x_max: 14.0
  x_init: [4.0, 14.0]

  # Binding mode parameters (only used when mode: "binding")
  binding:
    L_min_bins: 200              # smallest truncated window length, in saved bins
    L_max_bins: 400              # largest truncated window length and total two-sided shoot length
    N_max: 200000000             # per-leg raw-step safety guard
    epsilon: 0.05                # committor basin half-width: A={q<eps}, B={q>1-eps}
    max_shoot_attempts: 100      # per-leg retry budget inside one trace
    max_traj_retries: 5          # outer retry-on-None budget in the wrapper
    center_jitter_frac: 0.10     # crop center jitter as fraction of crop_half
    n_committor_grid: 4000       # committor / U(x) BVP grid resolution


data_generation:
  num_simulations: 200000       # number of simulations to generate
  batch_size: 100              # simulations per batch
  chunk_size: 128              # HDF5 chunk size (samples per chunk)
  num_traces_per_set: 1        # iid traces per parameter set (1 = single-trace mode)
  nuisance_per_set: false      # true = draw nuisance ONCE per set (shared across traces, like a fixed detector); false = resample per trace
  nuisance_per_trace_params: []  # nuisance params kept per-trace even when nuisance_per_set=true (e.g. ["kD"]); empty = no exceptions

output:
  directory: ./data/base            # output directory for training data