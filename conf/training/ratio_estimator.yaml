defaults:
  - _self_

# Training settings
training:
  batch_size: 128
  validation_fraction: 0.1
  num_epochs: 150
  compile: true

# Optimizer settings
optimizer:
  lr: 1e-3
  weight_decay: 0.01

# Learning rate scheduler settings
scheduler:
  max_lr: 1e-3
  pct_start: 0.3
  final_div_factor: 1e4

# Embedding settings
embedding:
  dim: 16
  dim_mults: [1, 2]
  attention: False
  kernel_size: 3
  output_dim: 32

# Ratio estimator (classifier) settings
classifier:
  model: "resnet"
  hidden_features: 128
  num_atoms: 50

# Data settings
data:
  data_dir: "data/base"
  chunk_size: 1000        # matches HDF5 chunk size for optimal I/O
  chunk_step: 10          # load 10k samples per I/O operation
  num_workers: 8          # parallel workers for decompression
  prefetch_factor: 4      # batches to prefetch per worker
  output_path: "ratio_estimator.pkl"

hydra:
  run:
    dir: outputs/ratio_estimator/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/ratio_estimator/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false  # Stay in original directory
