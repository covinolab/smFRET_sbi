
defaults:
  - embedding: cnn
  - _self_

training:
  batch_size: 128
  validation_fraction: 0.1
  num_epochs: 20
  seed: 42
  compile: false
  grad_clip: 10.0
  checkpoint_interval_minutes: 0.5
  resume_from: null

optimizer:
  lr: 1e-3
  weight_decay: 0.01

scheduler:
  max_lr: 5e-4
  pct_start: 0.3
  final_div_factor: 1e4

embedding:
  dim: 32
  dim_mults: [1, 2, 4]
  attention: true
  padding_mode: reflect
  kernel_size: 3
  downsample: 0
  output_dim: 128

flow:
  model: "maf"
  hidden_features: 32
  num_transforms: 1
  num_blocks: 2
  dropout_probability: 0.1
  use_batch_norm: false

classifier:
  hidden_features: 128
  num_atoms: 20
  dropout_probability: 0.1
  num_blocks : 2
  use_batch_norm: false
  regularization_strength: 0.1

# Data settings
data:
  data_dir: "data/test"
  chunk_size: 128
  chunk_step: 1
  num_workers: 2
  prefetch_factor: 3

artifacts:
  model_filename: "estimator.pkl"
  checkpoint_filename: "checkpoint.pt"
  data_config_copy_filename: "data_config.yaml"
 
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false  # Stay in original directory
