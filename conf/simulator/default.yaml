# Prior bounds for all inferred parameters (12 total)
prior:
  # Dynamics parameters
  logD_lims: [-0.5, 2.0]       # log10 of diffusion coefficient
  
  # FRET parameters  
  R0_lims: [6.0, 12.0]          # Förster radius
  kD_lims: [0.1, 10.0]         # Donor excitation rate
  
  # Background rates
  k_gb_lims: [0.0, 0.25]        # Green photon background rate
  k_rb_lims: [0.0, 0.25]        # Red photon background rate
  
  # Detector efficiencies
  eta_g_lims: [0.7, 1.0]       # Green detector quantum efficiency
  eta_r_lims: [0.7, 1.0]       # Red detector quantum efficiency
  
  # Cross-talk matrix (spectral bleed-through)
  C_gg_lims: [0.8, 1.0]        # Prob green photon -> green detector
  C_rr_lims: [0.8, 1.0]        # Prob red photon -> red detector
  C_gr_lims: [0.0, 0.2]        # Prob green photon -> red detector
  C_rg_lims: [0.0, 0.2]        # Prob red photon -> green detector

  num_knots: 5                # number of spline knots for potential
  spline_mean: null           # mean values for spline coefficients (default: zero)
  spline_scale: 10.0
  spline_correlation: 1
  prior_type: uniform         # "uniform" (independent per-knot), "igmrf" (first/second-difference prior), or "gp" (exponential-decay GP)
  igmrf_order: 1              # 1=first differences, 2=curvature penalty (only used when prior_type=igmrf)


# Fixed simulator parameters (not inferred)
simulator:
  mode: "equilibrium"            # "equilibrium" (standard smFRET_simulator) or "binding" (h-transform)
  total_time: 10000.0
  saving_frequency: 10000
  time_step: 5e-5
  spline_type: "cubic"
  boundary_condition: "linear"
  num_boundary_knots: 3
  max_force: 30.0
  x_min: 4.0
  x_max: 14.0
  x_init: [4.0, 14.0]

  # Binding mode parameters (only used when mode: "binding")
  binding:
    n_grid: 500                  # grid points for h-transform precomputation
    F_guide_max_factor: 0.1      # guiding force clamp (validated: 0.1 is safe)
    N_max: 200000000             # max integration steps safety cutoff
    min_steps: 0                 # reject transition paths shorter than this (0 = no minimum)
    max_bins: 10000              # padded sequence length for variable-length binding traces


data_generation:
  num_simulations: 200000       # number of simulations to generate
  batch_size: 100              # simulations per batch
  chunk_size: 128              # HDF5 chunk size (samples per chunk)

output:
  directory: ./data/base            # output directory for training data